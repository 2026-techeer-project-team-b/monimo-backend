spring:
  application:
    name: detector
  # PG 가 커넥션은 주고 응답은 안 하는 경우에 영구히 기다리지 않게 한다 (ADR #54).
  # 끊긴 PG 는 Hikari connectionTimeout(기본 30초)이 이미 막는다. 이 값은 그 다음 구간이다.
  # 단위는 밀리초가 아니라 초다. 10000 을 넣으면 2.8시간이 되어 조용히 안 듣는다.
  datasource:
    hikari:
      data-source-properties:
        socketTimeout: 10
  # 주기 작업 하나가 막혀도 나머지가 굶지 않게 한 칸 비워 둔다 (ADR #54).
  # 지금은 모듈마다 @Scheduled 가 하나뿐이라 효과가 0 이고, 둘째가 들어올 때를 위한 예방이다.
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    open-in-view: false          # ADR #42 가드레일 ②
    hibernate:
      ddl-auto: validate         # 표는 db/postgres 마이그레이션이 만든다. 코드는 표를 바꾸지 않고 맞는지만 확인 (ADR #49)
  flyway:
    enabled: false               # 서비스는 마이그레이션을 돌리지 않는다 (ADR #49)

server:
  port: 8083

monimo:
  # 내부 문(/api/v1/internal/**) 공유 비밀값. API 서버와 같은 값을 X-Internal-Token 으로 보낸다
  internal-token: ${MONIMO_INTERNAL_TOKEN:}
  alert:
    schedule:
      query:
        base-url: ${MONIMO_API_SERVER_URL:http://localhost:8080}   # service-health 를 여는 API 서버

management:
  server:
    port: 8081                   # 관리 포트. actuator 는 업무 포트와 나눠 밖(인그레스)으로 안 나간다. probe 는 kubelet 이 파드에 직접 붙는다
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness · /actuator/health/readiness (헬스체크 규약)
      group:
        readiness:
          include: readinessState, db   # 일할 수 있나 = PostgreSQL 에 붙나. API 서버 · Slack 같은 외부는 넣지 않는다 (남이 죽었다고 나까지 빠지면 안 된다)

logging:
  level:
    org.hibernate.SQL: debug     # ADR #42 가드레일 ⑤ 실행 SQL 상시 로깅
