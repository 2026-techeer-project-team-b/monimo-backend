# 로컬 개발용 인프라: Kafka · ClickHouse · PostgreSQL
#
#   실행:
#   docker compose up -d --wait
#
# 호스트 포트는 다른 프로젝트와 겹치지 않게 1로 시작하는 번호를 쓴다. 바꾸려면 .env (견본: .env.example)
# 이미지 태그는 정확한 버전으로 고정한다. 올릴 때는 PR로.
#
#   수집기까지 컨테이너로 (쇼핑몰 에이전트가 collector:4317 로 보내는 것을 시험할 때):
#   docker compose --profile collector up -d --wait --build
#   ./scripts/check-wiring.sh
#
#   적재 처리기까지 컨테이너로 (수집기 → Kafka → 적재 처리기 한 줄을 통째로 시험할 때):
#   docker compose --profile collector --profile ingester up -d --wait --build
#   ./scripts/check-pipeline.sh

name: monimo-dev

# 공용 네트워크 monimo-dev (개발환경 6단계 연결 약속). monimo-shop 의 compose 도 이 네트워크를 external 로 쓴다.
# 먼저 만들어 둬야 한다:  docker network create monimo-dev
networks:
  default:
    name: monimo-dev
    external: true

services:
  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: 컨테이너끼리 (kafka:29092) / EXTERNAL: 내 컴퓨터에서 bootRun 한 앱 (localhost:19092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 kafka-init 이 정해진 설정으로만 만든다. 오타 난 토픽이 저절로 생기지 않게 막는다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # "정상" = 브로커가 떴고 토픽 2개까지 만들어진 상태. 그래서 up --wait 은 토픽이 준비된 뒤에 끝난다.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list 2> /dev/null | grep -qx raw.dlq"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 10s

  # 토픽 만들기 (한 번 실행하고 끝나는 컨테이너). raw 7일 · raw.dlq 30일 보관 (ADR #34)
  # Kafka 데이터는 컨테이너 안에만 있어서 down 하면 메시지와 토픽이 지워지고, 다시 켜면 이게 새로 만든다.
  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        for i in $$(seq 1 60); do
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1 && break
          sleep 2
        done
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic raw     --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic raw.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        $$T --bootstrap-server kafka:29092 --list
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.10.6
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-monimo}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monimo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      # 서버가 살아 있나만 본다. 표를 만드는 일은 clickhouse-migrate 가 맡는다 (ADR #57).
      # 전에는 여기서 마지막 MV 까지 확인했다 : ClickHouse 자신이 처음 켜질 때 표를 만들었기 때문이다
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:17.11-alpine
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: monimo
      POSTGRES_USER: ${POSTGRES_USER:-monimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monimo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d monimo"]
      interval: 5s
      timeout: 5s
      retries: 30

  # PostgreSQL 마이그레이션 (한 번 실행하고 끝나는 컨테이너). 파일: db/postgres/**/V*.sql (ADR #49)
  # 버전은 Spring Boot 3.5가 쓰는 Flyway와 같은 11.7.2
  postgres-migrate:
    image: flyway/flyway:11.7.2-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/postgres:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/monimo
      FLYWAY_USER: ${POSTGRES_USER:-monimo}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-monimo}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # 이름 규칙에 안 맞는 파일을 조용히 건너뛰지 않고 실패시킨다
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      # 번호(만든 시각)와 머지 순서가 달라도 늦게 들어온 파일을 적용한다.
      # 순서 의존 문제는 CI(dev-infra)가 빈 DB에 번호 순으로 전부 돌려서 잡는다
      FLYWAY_OUT_OF_ORDER: "true"
      FLYWAY_CONNECT_RETRIES: "10"
    command: migrate
    restart: "no"

  # ClickHouse 마이그레이션 (한 번 실행하고 끝나는 컨테이너). 파일: db/clickhouse/V*.sql (ADR #57)
  # 전에는 ClickHouse 가 처음 켜질 때 docker-entrypoint-initdb.d 로 읽었다. 그러면 데이터가 있는
  # 서버에는 영영 적용되지 않아서, 고칠 때마다 DB 를 통째로 날리는 수밖에 없었다.
  #
  # 접속 대상이 monimo 가 아니라 default 인 이유 : 빈 서버에는 monimo DB 가 아직 없다.
  # monimo 를 만드는 것이 첫 마이그레이션(V202609220045)이라 거기에 붙을 수가 없다.
  # 그래서 default 에 붙고 장부(flyway_schema_history)도 default 에 생긴다.
  clickhouse-migrate:
    build:
      context: ./db/clickhouse
    image: monimo/clickhouse-migrate:dev
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./db/clickhouse:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:clickhouse://clickhouse:8123/default
      FLYWAY_USER: ${CLICKHOUSE_USER:-monimo}
      FLYWAY_PASSWORD: ${CLICKHOUSE_PASSWORD:-monimo}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # 이름 규칙에 안 맞는 파일을 조용히 건너뛰지 않고 실패시킨다
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      # 번호(만든 시각)와 머지 순서가 달라도 늦게 들어온 파일을 적용한다 (PG 와 같은 기준)
      FLYWAY_OUT_OF_ORDER: "true"
      FLYWAY_CONNECT_RETRIES: "10"
      # default 에 표가 하나라도 있고 장부가 없으면 Flyway 는 "비어 있지 않은데 장부가 없다" 로 멈춘다.
      # 누가 ClickHouse 에 임시 표를 만들어 두면 그 사람은 스택이 아예 안 뜬다.
      # 이것을 켜면 장부를 v1 로 깔고 시작하는데, 우리 파일 번호가 전부 2026... 이라 v1 보다 커서
      # 하나도 안 건너뛰고 그대로 실행된다. 게다가 전부 IF NOT EXISTS 라 이미 있으면 아무 일도 안 한다
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    command: migrate
    restart: "no"

  # 준비 완료 표시등: 토픽 만들기 · 마이그레이션이 "끝나야" 켜진다.
  # up --wait 은 이게 healthy 가 될 때까지 기다리므로, 끝나면 바로 앱을 띄워도 된다.
  infra-ready:
    image: postgres:17.11-alpine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
    entrypoint: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      retries: 3

  # 수집기 (프로필 collector 일 때만). 이미지는 레포 루트의 collector/Dockerfile 로 그 자리에서 만든다.
  # 컨테이너끼리는 collector:4317 · 내 컴퓨터에서는 localhost:4317 (IDE 로 직접 실행하면 이 프로필을 켜지 않는다)
  collector:
    profiles: ["collector"]
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: monimo/collector:dev
    ports:
      - "${COLLECTOR_OTLP_PORT:-4317}:4317"
      - "${COLLECTOR_HTTP_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # local 프로필의 localhost 대신 컨테이너 이름으로
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-monimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monimo}
      KAFKA_HOST: kafka
      KAFKA_PORT: "29092"
      # 트레이스 샘플링 비율. 로컬 기본은 1.0(전부 통과)이라 보낸 것이 그대로 보인다.
      # PG 를 못 읽었을 때 쓸 기본값이다. 정본은 PG application_configs 이고 PG 가 이긴다 (ADR #53).
      # PG 를 멈춘 채로 수집기를 띄워 이 값이 쓰이는지 보려면 .env 에 COLLECTOR_SAMPLING_RATIO=0.1 처럼 넣는다
      MONIMO_COLLECTOR_SAMPLING_RATIO: "${COLLECTOR_SAMPLING_RATIO:-1.0}"
      # 헬스체크로 보고 버릴 주소. SERVER 스팬의 url.path 가 이 중 하나와 정확히 같으면 Kafka 로 안 보낸다.
      # 비우면 필터가 꺼져 헬스체크도 그대로 적재된다. .env 에 COLLECTOR_HEALTH_CHECK_PATHS= 로 빈 값을 넣으면 된다.
      # :- 가 아니라 - 를 쓴다: :- 는 빈 값일 때도 기본값을 되살려서 끌 수가 없다
      MONIMO_COLLECTOR_HEALTH_CHECK_PATHS: "${COLLECTOR_HEALTH_CHECK_PATHS-/actuator/health}"
      # 스레드 덤프 명령 문 (#122). 쇼핑몰 Extension 은 /agent/** 에 에이전트 토큰을, API 서버 팬아웃은 /internal/** 에 내부 토큰을 붙인다.
      # 로컬 전용 기본값이다. 에이전트 토큰은 monimo-shop compose 의 MONIMO_AGENT_TOKEN 과 같아야 한다.
      # :- 라서 .env 에 빈 값을 넣어도 기본값이 되살아난다. 문을 닫아 보려면 컨테이너 env 를 직접 비운다 (수집기는 빈 값이면 문을 닫는다)
      MONIMO_AGENT_TOKEN: ${MONIMO_AGENT_TOKEN:-local-agent-token}
      MONIMO_INTERNAL_TOKEN: ${MONIMO_INTERNAL_TOKEN:-local-internal-token}
      # 명령의 reply_to (Extension 이 결과를 보낼 이 수집기 주소). 수집기가 한 대라 compose 서비스 이름 그대로
      MONIMO_COLLECTOR_ADVERTISED_URL: http://collector:8081
    depends_on:
      infra-ready:
        condition: service_healthy
    healthcheck:
      # 실행 이미지에 curl 이 없어서 bash 의 /dev/tcp 로 /actuator/health 를 읽는다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 적재 처리기 (프로필 ingester 일 때만). 수집기가 raw 에 넣은 것을 꺼내 protobuf 로 푼다.
  # IDE 나 bootRun 으로 직접 실행할 때는 이 프로필을 켜지 않는다 (8082 포트가 겹친다)
  ingester:
    profiles: ["ingester"]
    build:
      context: .
      dockerfile: ingester/Dockerfile
    image: monimo/ingester:dev
    ports:
      - "${INGESTER_HTTP_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # local 프로필의 localhost 대신 컨테이너 이름으로
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-monimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monimo}
      KAFKA_HOST: kafka
      KAFKA_PORT: "29092"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-monimo}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monimo}
      # 적재 실패 때 버티는 시간 (ADR #51). 기본값은 application.yml(10m · 1m). 빈 값이면 기본값으로 돌아간다
      MONIMO_INGESTER_RETRY_TRANSIENT_MAX_ELAPSED: ${INGESTER_RETRY_TRANSIENT_MAX_ELAPSED:-10m}
      MONIMO_INGESTER_RETRY_UNKNOWN_MAX_ELAPSED: ${INGESTER_RETRY_UNKNOWN_MAX_ELAPSED:-1m}
    depends_on:
      infra-ready:
        condition: service_healthy
    healthcheck:
      # 실행 이미지에 curl 이 없어서 bash 의 /dev/tcp 로 /actuator/health 를 읽는다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082; printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  clickhouse-data:
  postgres-data:
