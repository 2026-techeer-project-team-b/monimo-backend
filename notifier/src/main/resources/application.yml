spring:
  application:
    name: notifier
  # PG 가 커넥션은 주고 응답은 안 하는 경우에 영구히 기다리지 않게 한다 (ADR #54).
  # 끊긴 PG 는 Hikari connectionTimeout(기본 30초)이 이미 막는다. 이 값은 그 다음 구간이다.
  # 단위는 밀리초가 아니라 초다. 10000 을 넣으면 2.8시간이 되어 조용히 안 듣는다.
  datasource:
    hikari:
      data-source-properties:
        socketTimeout: 10
  # 주기 작업 하나가 막혀도 나머지가 굶지 않게 한 칸 비워 둔다 (ADR #54).
  # 지금은 모듈마다 @Scheduled 가 하나뿐이라 효과가 0 이고, 둘째가 들어올 때를 위한 예방이다.
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    open-in-view: false          # ADR #42 가드레일 ②
    hibernate:
      ddl-auto: validate         # 표는 db/postgres 마이그레이션이 만든다. 코드는 표를 바꾸지 않고 맞는지만 확인 (ADR #49)
  flyway:
    enabled: false               # 서비스는 마이그레이션을 돌리지 않는다 (ADR #49)

server:
  port: 8084

monimo:
  # 내부 문(/internal/**) 공유 비밀값. api-server 가 같은 값을 X-Internal-Token 으로 보낸다. 비우면 내부 문이 전부 닫힌다
  internal-token: ${MONIMO_INTERNAL_TOKEN:}

management:
  server:
    port: 18084                  # 관리 포트 = 업무 포트 + 10000 (#150 · ADR #61). actuator 는 업무 포트와 나눠 밖(인그레스)으로 안 나간다. probe 는 kubelet 이 파드에 직접 붙는다
  endpoints:
    web:
      exposure:
        include: health, metrics   # metrics: 주기 작업 낡음 게이지(ADR #54)를 밖에서 읽게. 관리 포트라 인그레스로 안 나간다
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness · /actuator/health/readiness (헬스체크 규약)
        add-additional-paths: true   # 업무 포트에도 /livez · /readyz. 관리 포트만 쏘면 업무 포트가 막혀도 통과한다 (#211 · ADR #58)
      # readiness 에 저장소(db)를 넣지 않는다 (ADR #58, #211 로 다섯 모듈 통일). 저장소가 하나라 흔들리면 파드가 전부 동시에 빠지고,
      # probe 는 1초에 끊는데 Hikari 연결 대기는 30초라 쿠버네티스는 원인을 못 본다. 저장소 장애는 저장소 쪽 경보로 본다.
      # group 을 적지 않으면 기본 구성(liveness = livenessState · readiness = readinessState 뿐)이다

logging:
  level:
    org.hibernate.SQL: debug     # ADR #42 가드레일 ⑤ 실행 SQL 상시 로깅
