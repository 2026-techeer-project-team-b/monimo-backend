# 라이브러리 버전은 이 파일 한 곳에서만 정한다. 모듈의 build.gradle.kts 에는 버전을 쓰지 않는다.

[versions]
java = "17"
kotlin = "2.2.21"
spring-boot = "3.5.16"
opentelemetry-proto = "1.11.0-alpha"
kotest = "6.2.5"
clickhouse-java = "0.10.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
# 저장소 연결 (PG = JPA ADR #42 · CH 조회 = JDBC · CH 적재 = client-v2 · Kafka = Spring for Apache Kafka)
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
postgresql = { module = "org.postgresql:postgresql" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
clickhouse-jdbc = { module = "com.clickhouse:clickhouse-jdbc", version.ref = "clickhouse-java" }
clickhouse-client-v2 = { module = "com.clickhouse:client-v2", version.ref = "clickhouse-java" }
# 테스트용 진짜 저장소 (Testcontainers) + 테스트에서 db/postgres 마이그레이션 적용
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
testcontainers-clickhouse = { module = "org.testcontainers:clickhouse" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# 테스트는 Kotest (ADR #48). JUnit Platform 위에서 돈다.
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# 임시 Kafka 메시지 형식: 수집기가 받은 OTLP를 protobuf 바이트 그대로 raw 토픽에 넣고, 적재 처리기가 이 라이브러리로 푼다.
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "opentelemetry-proto" }

[bundles]
# 5개 서비스 모듈이 공통으로 쓰는 것
service-base = ["spring-boot-starter-web", "spring-boot-starter-actuator", "jackson-module-kotlin", "kotlin-reflect"]
service-test = ["spring-boot-starter-test", "kotest-runner-junit5", "kotest-assertions-core", "kotest-extensions-spring"]
# PostgreSQL 쓰는 모듈 공통 (5개 서비스 전부)
postgres = ["spring-boot-starter-data-jpa", "postgresql"]
postgres-test = ["spring-boot-testcontainers", "testcontainers-postgresql", "flyway-core", "flyway-postgresql"]
# 스프링이 없는 모듈(common)용
kotest = ["kotest-runner-junit5", "kotest-assertions-core"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
# JPA Entity용 allOpen · noArg (ADR #42 가드레일 ④)
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
