spring:
  application:
    name: api-server
  # PG 가 커넥션은 주고 응답은 안 하는 경우에 영구히 기다리지 않게 한다 (ADR #54).
  # 끊긴 PG 는 Hikari connectionTimeout(기본 30초)이 이미 막는다. 이 값은 그 다음 구간이다.
  # 단위는 밀리초가 아니라 초다. 10000 을 넣으면 2.8시간이 되어 조용히 안 듣는다.
  datasource:
    hikari:
      data-source-properties:
        socketTimeout: 10
  jpa:
    open-in-view: false          # ADR #42 가드레일 ②
    hibernate:
      ddl-auto: validate         # 표는 db/postgres 마이그레이션이 만든다. 코드는 표를 바꾸지 않고 맞는지만 확인 (ADR #49)
  flyway:
    enabled: false               # 서비스는 마이그레이션을 돌리지 않는다 (ADR #49)
  jackson:
    property-naming-strategy: SNAKE_CASE   # 요청·응답 JSON 필드는 명세대로 snake_case (next_cursor, trace_id)

server:
  port: 8080

monimo:
  auth:
    # access JWT(HS256) 서명 키. 32바이트 이상. 비우면 기동 때 임시 키를 만들어 재시작마다 토큰이 전부 무효가 된다 (로컬 · 테스트 전용)
    jwt-secret: ${MONIMO_JWT_SECRET:}
    access-ttl: 3600s
    refresh-ttl: 14d
    # refresh 쿠키의 Secure 속성. HTTPS 가 아닌 로컬에서만 끈다
    cookie-secure: true
  # 내부 문 5개(/api/v1/internal/**)의 X-Internal-Token 값. 비우면 내부 문이 전부 닫힌다
  internal-token: ${MONIMO_INTERNAL_TOKEN:}
  # 채널 시험 발송(#13)이 부르는 알림 서비스. X-Internal-Token 은 위 값을 그대로 보낸다
  notifier:
    base-url: ${MONIMO_NOTIFIER_URL:http://localhost:8084}

# REST 명세(/v3/api-docs)와 Swagger UI(/swagger-ui.html)는 기본으로 끈다. local 프로필에서만 켠다.
# 이 접두는 API 명세 §0-1 주소 규칙에 없고 §0-2 인증 분류도 미정이라 운영에 노출하지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug     # ADR #42 가드레일 ⑤ 실행 SQL 상시 로깅
  pattern:
    correlation: "[%X{requestId:-}] "   # 로그 줄마다 X-Request-Id (RequestIdFilter)
