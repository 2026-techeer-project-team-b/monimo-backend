# 로컬 프로필: 내 컴퓨터의 compose.yaml 인프라에 붙는다.
# 실행: ./gradlew :api-server:bootRun --args='--spring.profiles.active=local'
# 포트·계정을 .env 로 바꿨다면 같은 이름의 환경변수로 덮어쓸 수 있다.

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/monimo
    username: ${POSTGRES_USER:monimo}
    password: ${POSTGRES_PASSWORD:monimo}

monimo:
  clickhouse:
    jdbc-url: jdbc:clickhouse://localhost:${CLICKHOUSE_HTTP_PORT:18123}/monimo
    username: ${CLICKHOUSE_USER:monimo}
    password: ${CLICKHOUSE_PASSWORD:monimo}
  auth:
    cookie-secure: false         # 로컬은 http://localhost 라 Secure 쿠키가 안 붙는다
    # users 표가 비어 있으면 이 계정을 ADMIN 으로 만든다. 화면 가짜 응답의 데모 계정과 같은 값
    bootstrap-admin:
      email: admin@monimo.io
      password: monimo2026
      name: 관리자
  internal-token: local-internal-token

# 로컬에서만 REST 명세 · Swagger UI 를 켠다: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoint:
    health:
      show-details: always   # 로컬에서는 /actuator/health 에 DB별 연결 상태까지 보여 준다

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # 로컬에서는 SQL에 들어간 값까지 본다
