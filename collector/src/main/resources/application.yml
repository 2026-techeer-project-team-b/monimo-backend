spring:
  application:
    name: collector
  jpa:
    open-in-view: false          # ADR #42 가드레일 ②
    hibernate:
      ddl-auto: validate         # 표는 db/postgres 마이그레이션이 만든다. 코드는 표를 바꾸지 않고 맞는지만 확인 (ADR #49)
  flyway:
    enabled: false               # 서비스는 마이그레이션을 돌리지 않는다 (ADR #49)
  kafka:
    # 임시 메시지 형식: OTLP protobuf 바이트 그대로 (개발환경 9단계에서 확정)
    producer:
      # 브로커가 저장을 끝낸 뒤에만 성공으로 친다
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8081

# OTLP gRPC 수신 포트. 쇼핑몰 에이전트는 컨테이너끼리 collector:4317, 내 컴퓨터에서는 localhost:4317 로 보낸다 (개발환경 6단계 연결 약속)
monimo:
  collector:
    otlp:
      grpc:
        port: 4317
    # 트레이스 샘플링. 에이전트는 100% 보내고(always_on) 고르는 일은 수집기가 한다 (ADR #33).
    # 카나리 표시(trace_state 의 monimon=canary)가 붙은 것은 비율과 무관하게 통과한다 (ADR #41).
    # 다음 이슈에서 이 비율을 PG(application_configs)에서 읽어 재배포 없이 바꾼다
    sampling:
      ratio: 0.01
    # 헬스체크 스팬 거르기. 도커 · 쿠버네티스가 쇼핑몰의 이 주소를 몇 초마다 찌르는데, 에이전트가 그걸
    # 진짜 요청과 똑같이 기록해 보내 집계(호출 수 · 에러율 · P95 · 히트맵)를 틀리게 만든다.
    # SERVER 스팬의 url.path 가 이 목록과 정확히 같을 때만 버린다. CLIENT 는 진짜 호출이라 남긴다.
    # 비워 두면 필터가 꺼진다 (머지 전후 비교나 헬스체크 조사용).
    # 환경변수 MONIMO_COLLECTOR_HEALTH_CHECK_PATHS 로 덮어쓴다 (쉼표 구분)
    health-check:
      paths: /actuator/health

# /actuator/metrics 로 받은 건수(monimo.collector.otlp.received)를 본다. 연결 점검 스크립트가 읽는다
management:
  endpoints:
    web:
      exposure:
        include: health, metrics

logging:
  level:
    org.hibernate.SQL: debug     # ADR #42 가드레일 ⑤ 실행 SQL 상시 로깅
