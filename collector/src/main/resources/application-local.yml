# 로컬 프로필: 내 컴퓨터의 compose.yaml 인프라에 붙는다.
# 실행: ./gradlew :collector:bootRun --args='--spring.profiles.active=local'
# 포트·계정을 .env 로 바꿨다면 같은 이름의 환경변수로 덮어쓸 수 있다.
# compose 의 collector 프로필(컨테이너)은 같은 프로필에 POSTGRES_HOST=postgres · KAFKA_HOST=kafka 만 바꿔 넣는다.

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/monimo
    username: ${POSTGRES_USER:monimo}
    password: ${POSTGRES_PASSWORD:monimo}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:19092}

# 로컬에서는 보낸 것이 그대로 보여야 흐름을 확인할 수 있으므로 샘플링을 끈다(전부 통과).
# 단 아래 값은 PG 를 못 읽었을 때 쓰는 기본값이고 실제로는 PG 가 이긴다 (ADR #53).
# 로컬 PG 는 scripts/seed/postgres-applications.sql 이 1.0000 을 넣어 두므로 양쪽이 같다.
# 샘플링 자체의 동작은 단위 테스트(TraceSamplerTest)가 확인한다
monimo:
  collector:
    sampling:
      ratio: 1.0

management:
  endpoint:
    health:
      show-details: always   # 로컬에서는 /actuator/health 에 DB별 연결 상태까지 보여 준다

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # 로컬에서는 SQL에 들어간 값까지 본다
    com.monimo.collector: debug          # 로컬에서는 "OTLP traces 수신" · "샘플링: ..." 같은 줄을 눈으로 본다
