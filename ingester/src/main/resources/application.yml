spring:
  application:
    name: ingester
  # PG 가 커넥션은 주고 응답은 안 하는 경우에 영구히 기다리지 않게 한다 (ADR #54).
  # 끊긴 PG 는 Hikari connectionTimeout(기본 30초)이 이미 막는다. 이 값은 그 다음 구간이다.
  # 단위는 밀리초가 아니라 초다. 10000 을 넣으면 2.8시간이 되어 조용히 안 듣는다.
  datasource:
    hikari:
      data-source-properties:
        socketTimeout: 10
  jpa:
    open-in-view: false          # ADR #42 가드레일 ②
    hibernate:
      ddl-auto: validate         # 표는 db/postgres 마이그레이션이 만든다. 코드는 표를 바꾸지 않고 맞는지만 확인 (ADR #49)
  flyway:
    enabled: false               # 서비스는 마이그레이션을 돌리지 않는다 (ADR #49)
  kafka:
    consumer:
      group-id: ingester
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    # raw.dlq 로 보낼 때 쓴다 (RawErrorHandlerConfig). 꺼낸 그대로(String 키 · ByteArray 값) 다시 넣는다
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8082

# 적재 실패 때 얼마나 기다리나 (ADR #51). 실패 종류마다 다르다 : 확실한 일시 장애 10분 · 모르는 실패 1분 · 독성 0.
# 지금까지는 이 설정이 없어 스프링 기본값(간격 0초 × 10회 = 약 4초)이 쓰였고 그 뒤 메시지를 버렸다.
# 환경변수로 덮어쓴다 : MONIMO_INGESTER_RETRY_TRANSIENT_MAX_ELAPSED=20m 같은 식
monimo:
  ingester:
    retry:
      initial-interval: 2s
      multiplier: 2.0
      max-interval: 30s
      transient-max-elapsed: 10m
      unknown-max-elapsed: 1m
      dlq-topic: raw.dlq

# 관리 포트 (#135). /actuator/** 전부 여기로 옮겨 밖(인그레스)으로 안 나간다. 번호는 업무 포트 + 10 (수집기 8091 과 같은 규칙)
management:
  server:
    port: 8092
  endpoint:
    health:
      probes:
        enabled: true                 # /actuator/health/liveness · /actuator/health/readiness (헬스체크 규약)
        # 업무 포트(8082)에도 /livez · /readyz 를 연다. 쿠버네티스는 이쪽을 쏜다.
        # 관리 포트만 보면 업무 포트가 막혀도 "정상" 이 나온다 (두 포트가 일꾼 · 연결 묶음을 따로 가진다). 공식 문서가 그렇게 권한다
        add-additional-paths: true
      # readiness 에 저장소(db)를 넣지 않는다 (ADR #58). 적재 처리기는 요청을 받지 않고 Kafka 에서 스스로 꺼내므로 readiness 가 하는 일은
      # 배포 진행을 막는 것뿐이다. 저장소가 하나라 흔들리면 파드가 전부 동시에 빠지고, Kafka · ClickHouse 는 확인 기능이 Spring 에 없어 직접 짜야 한다.
      # group 을 적지 않으면 기본 구성(liveness = livenessState · readiness = readinessState 뿐)이다
  # /actuator/metrics 로 소비 건수(monimo.ingester.raw.consumed)와 DLQ 건수(monimo.ingester.dlq)를 본다. 연결 점검 · 관통 확인 스크립트가 관리 포트로 읽는다
  endpoints:
    web:
      exposure:
        include: health, metrics

logging:
  level:
    org.hibernate.SQL: debug     # ADR #42 가드레일 ⑤ 실행 SQL 상시 로깅
