# 테스트 전용 덧붙임. main 의 application.yml 은 그대로 로드되고 여기 키만 더해진다.
# 서비스 목록 캐시를 짧게 해서 RawConsumerTest 가 방금 넣은 서비스를 30초 기다리지 않고 본다
monimo.ingester.service-catalog.ttl=200ms

# 테스트 로그에 "raw 소비 · spans 적재" 같은 적재 처리기 디버그 줄을 남긴다 (실패 원인 추적용)
logging.level.com.monimo.ingester=debug

# 적재 실패 대기(ADR #51)를 짧게. main 의 10m · 1m 을 그대로 쓰면 예상 못 한 실패 하나가 컨테이너를 최대 10분 멈추고,
# 컨텍스트가 스펙 사이에 공유되므로 다음 스펙까지 멈춘 채 간다
monimo.ingester.retry.transient-max-elapsed=2s
monimo.ingester.retry.unknown-max-elapsed=1s
