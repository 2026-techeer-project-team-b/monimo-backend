# 로컬 인프라(compose.yaml)가 Intel 계열(amd64) 컴퓨터에서도 뜨는지, 그리고 수집기 컨테이너가
# 공용 네트워크에서 OTLP 를 받는지(연결 약속) 확인한다.
# compose · DDL · 가짜 데이터 · 점검 스크립트 · 수집기가 바뀐 PR에서만 돈다.
name: dev-infra

on:
  pull_request:
    branches: [main]
    paths:
      - compose.yaml
      - db/**
      - scripts/check-dev-infra.sh
      - scripts/seed-clickhouse.sh
      - scripts/check-wiring.sh
      - collector/**
      - common/**
      - gradle/**
      - "*.gradle.kts"
      - .github/workflows/dev-infra.yml
  push:
    branches: [main]
    paths:
      - compose.yaml
      - db/**
      - scripts/check-dev-infra.sh
      - scripts/seed-clickhouse.sh
      - scripts/check-wiring.sh
      - collector/**
      - common/**
      - gradle/**
      - "*.gradle.kts"
      - .github/workflows/dev-infra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-infra:
    name: dev-infra (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 공용 네트워크 만들기
        run: docker network create monimo-dev
      - name: 인프라 켜기
        run: docker compose up -d --wait
      - name: 점검
        run: ./scripts/check-dev-infra.sh
      - name: 가짜 데이터 넣기
        run: ./scripts/seed-clickhouse.sh
      - uses: docker/setup-buildx-action@v4
      - name: 수집기 컨테이너 켜기 (연결 약속)
        run: docker compose --profile collector up -d --wait --build
      - name: 연결 점검 (telemetrygen → collector:4317)
        run: ./scripts/check-wiring.sh
      - name: 실패하면 로그 보기
        if: failure()
        run: docker compose --profile collector logs --no-color --tail 100
      - name: 정리
        if: always()
        run: docker compose --profile collector down -v
