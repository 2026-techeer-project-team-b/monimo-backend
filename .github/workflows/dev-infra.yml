# 로컬 인프라(compose.yaml)가 Intel 계열(amd64) 컴퓨터에서도 뜨는지 확인한다.
# compose · DDL · 가짜 데이터 · 점검 스크립트가 바뀐 PR에서만 돈다.
name: dev-infra

on:
  pull_request:
    branches: [main]
    paths:
      - compose.yaml
      - db/**
      - scripts/check-dev-infra.sh
      - scripts/seed-clickhouse.sh
      - .github/workflows/dev-infra.yml
  push:
    branches: [main]
    paths:
      - compose.yaml
      - db/**
      - scripts/check-dev-infra.sh
      - scripts/seed-clickhouse.sh
      - .github/workflows/dev-infra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-infra:
    name: dev-infra (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 인프라 켜기
        run: docker compose up -d --wait
      - name: 점검
        run: ./scripts/check-dev-infra.sh
      - name: 가짜 데이터 넣기
        run: ./scripts/seed-clickhouse.sh
      - name: 실패하면 로그 보기
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: 정리
        if: always()
        run: docker compose down -v
